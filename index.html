<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>FXO EARN</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
    background:#020d18;
}

body{
    font-family:'Baloo Da 2','Inter',sans-serif;
    color:#ffffff;
    overflow-x:hidden;
}

/* =========================
   MAIN BACKGROUND
========================= */

.app{
    min-height:100vh;
    position:relative;
    overflow:hidden;

    background:
        radial-gradient(circle at 10% 10%,rgba(0,174,255,.35),transparent 28%),
        radial-gradient(circle at 90% 20%,rgba(0,98,255,.30),transparent 30%),
        radial-gradient(circle at 50% 60%,rgba(0,196,255,.16),transparent 35%),
        linear-gradient(145deg,#02111e,#042744 45%,#01101f);
}

/* Liquid glow */

.app::before,
.app::after{
    content:"";
    position:absolute;
    border-radius:50%;
    filter:blur(45px);
    pointer-events:none;
}

.app::before{
    width:260px;
    height:260px;
    background:rgba(0,174,255,.22);
    top:100px;
    left:-100px;
}

.app::after{
    width:300px;
    height:300px;
    background:rgba(0,72,255,.20);
    right:-130px;
    top:500px;
}

/* =========================
   TOP BAR
========================= */

.topbar{
    position:relative;
    z-index:10;

    min-height:118px;
    padding:22px 24px 18px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:
        linear-gradient(120deg,
        rgba(8,49,79,.94),
        rgba(0,91,145,.65),
        rgba(3,33,58,.92));

    border-bottom:1px solid rgba(130,225,255,.38);

    box-shadow:
        0 8px 35px rgba(0,130,255,.20),
        inset 0 -1px rgba(255,255,255,.08);
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.logo{
    width:78px;
    height:78px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:23px;

    font-family:Inter,sans-serif;
    font-size:43px;
    font-weight:900;

    color:#fff;

    background:
        linear-gradient(145deg,#35d8ff,#087be8);

    border:2px solid rgba(255,255,255,.48);

    box-shadow:
        0 0 15px #00bfff,
        0 0 35px rgba(0,145,255,.65),
        inset 0 0 20px rgba(255,255,255,.28);
}

.brandText h1{
    font-family:Inter,sans-serif;
    font-size:34px;
    line-height:1;
    font-weight:900;
    letter-spacing:-1px;
}

.brandText p{
    margin-top:8px;
    font-family:Inter,sans-serif;
    font-size:17px;
    font-weight:600;
    color:#9edfff;
}

/* Profile right */

.profileTop{
    display:flex;
    align-items:center;
    gap:8px;

    padding:7px 9px;

    border-radius:35px;

    background:
        linear-gradient(135deg,
        rgba(255,255,255,.18),
        rgba(0,159,255,.14));

    border:1px solid rgba(168,238,255,.55);

    box-shadow:
        inset 0 0 15px rgba(255,255,255,.08),
        0 0 18px rgba(0,174,255,.25);
}

.avatar{
    width:53px;
    height:53px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(circle at 35% 30%,#7deaff,#0879d5 65%,#03487d);

    border:2px solid rgba(255,255,255,.55);

    font-family:Inter,sans-serif;
    font-size:22px;
    font-weight:800;

    box-shadow:0 0 16px rgba(0,200,255,.65);
}

.userName{
    display:none;
}

.points{
    padding:11px 17px;

    border-radius:25px;

    font-family:Inter,sans-serif;
    font-size:18px;
    font-weight:800;

    white-space:nowrap;

    background:rgba(3,72,116,.72);
    border:1px solid rgba(176,240,255,.58);

    box-shadow:
        inset 0 0 12px rgba(255,255,255,.07),
        0 0 13px rgba(0,180,255,.25);
}

.points span{
    color:#bdf5ff;
}

/* =========================
   CONTENT
========================= */

.content{
    position:relative;
    z-index:2;

    padding:28px 26px 130px;
}

/* =========================
   GLASS CARD
========================= */

.glass{
    position:relative;

    border-radius:32px;

    background:
        linear-gradient(
            135deg,
            rgba(81,181,220,.24),
            rgba(2,51,87,.74) 45%,
            rgba(0,35,66,.86)
        );

    border:2px solid rgba(145,232,255,.52);

    box-shadow:
        inset 0 0 35px rgba(126,223,255,.08),
        0 0 22px rgba(0,155,255,.18),
        0 15px 35px rgba(0,0,0,.20);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    overflow:hidden;
}

/* Liquid reflections */

.glass::before{
    content:"";
    position:absolute;

    width:180px;
    height:180px;

    top:-90px;
    right:-50px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(153,241,255,.30),
            rgba(0,145,255,.06) 50%,
            transparent 70%
        );

    filter:blur(5px);
}

.glass::after{
    content:"";
    position:absolute;

    width:130px;
    height:130px;

    left:-60px;
    bottom:-65px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(74,218,255,.22),
            transparent 70%
        );
}

/* =========================
   BALANCE
========================= */

.balance{
    min-height:535px;

    padding:48px 25px;

    text-align:center;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.walletIcon{
    width:120px;
    height:120px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    margin-bottom:27px;

    font-size:53px;

    background:
        radial-gradient(circle at 35% 25%,
        rgba(255,255,255,.62),
        rgba(52,161,211,.25) 55%,
        rgba(0,55,91,.72));

    border:2px solid rgba(226,250,255,.68);

    box-shadow:
        0 0 25px rgba(0,180,255,.35),
        inset 0 0 22px rgba(255,255,255,.18);
}

.balanceTitle{
    font-size:34px;
    font-weight:800;
    line-height:1.2;

    text-shadow:
        0 0 12px rgba(255,255,255,.20);
}

.minimum{
    margin-top:8px;

    font-size:22px;
    font-weight:600;

    color:#7edcff;
}

.amount{
    margin-top:15px;

    font-family:Inter,sans-serif;
    font-size:58px;
    font-weight:900;
    letter-spacing:-2px;

    color:#ffffff;

    text-shadow:
        0 0 10px rgba(255,255,255,.35),
        0 0 30px rgba(0,178,255,.38);
}

.rate{
    margin-top:20px;

    padding:12px 25px;

    border-radius:30px;

    font-size:20px;
    font-weight:800;

    background:
        linear-gradient(
            120deg,
            rgba(255,255,255,.16),
            rgba(33,151,207,.20)
        );

    border:1px solid rgba(189,239,255,.55);

    box-shadow:
        inset 0 0 13px rgba(255,255,255,.08),
        0 0 15px rgba(0,180,255,.16);
}

/* =========================
   AD CARDS
========================= */

.adCard{
    margin-top:28px;
    padding:32px 26px 27px;
}

.adHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.adTitle{
    display:flex;
    align-items:center;
    gap:18px;
}

.adIcon{
    width:80px;
    height:80px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:23px;

    font-family:Inter,sans-serif;
    font-size:35px;

    background:
        linear-gradient(
            145deg,
            rgba(105,219,255,.27),
            rgba(0,74,121,.48)
        );

    border:1px solid rgba(174,239,255,.65);

    box-shadow:
        inset 0 0 20px rgba(255,255,255,.09),
        0 0 15px rgba(0,176,255,.18);
}

.adTitle h2{
    font-size:31px;
    font-weight:800;
}

.status{
    padding:9px 19px;

    border-radius:24px;

    font-size:19px;
    font-weight:700;

    color:#bffaff;

    background:rgba(0,170,145,.18);

    border:1px solid rgba(64,255,224,.48);
}

.status::before{
    content:"●";
    color:#27f59b;
    margin-right:7px;
}

.adDescription{
    margin:28px 0 23px;

    font-size:21px;
    font-weight:600;

    color:#9ee2f6;
}

.mainButton{
    width:100%;
    height:82px;

    border:none;
    border-radius:27px;

    color:white;

    font-family:'Baloo Da 2',sans-serif;
    font-size:29px;
    font-weight:800;

    background:
        linear-gradient(
            100deg,
            #05bdf2,
            #087bea,
            #355cf2
        );

    border:2px solid rgba(124,237,255,.75);

    box-shadow:
        0 0 18px rgba(0,196,255,.42),
        0 0 35px rgba(0,91,255,.25),
        inset 0 0 15px rgba(255,255,255,.20);

    cursor:pointer;

    transition:.2s;
}

.mainButton:active{
    transform:scale(.97);
}

/* =========================
   DOUBLE AD
========================= */

.double{
    margin-top:28px;
    padding-bottom:30px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottomNav{
    position:fixed;

    z-index:100;

    left:16px;
    right:16px;
    bottom:15px;

    height:93px;

    display:grid;
    grid-template-columns:repeat(4,1fr);

    padding:7px;

    border-radius:35px;

    background:
        linear-gradient(
            120deg,
            rgba(5,65,103,.92),
            rgba(5,118,169,.72),
            rgba(2,54,93,.94)
        );

    border:2px solid rgba(145,234,255,.52);

    box-shadow:
        0 0 30px rgba(0,146,255,.28),
        0 10px 35px rgba(0,0,0,.38);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
}

.navItem{
    border-radius:27px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:3px;

    color:#aee8fa;

    font-size:17px;
    font-weight:700;

    cursor:pointer;

    transition:.2s;
}

.navItem .navIcon{
    font-family:Inter,sans-serif;
    font-size:31px;
    line-height:1;
}

.navItem.active{
    color:white;

    background:
        linear-gradient(
            145deg,
            #18baf3,
            #1269ed
        );

    box-shadow:
        0 0 18px rgba(0,190,255,.65),
        inset 0 0 14px rgba(255,255,255,.15);
}

.navItem:active{
    transform:scale(.94);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:390px){

    .topbar{
        padding-left:17px;
        padding-right:17px;
    }

    .logo{
        width:64px;
        height:64px;
        font-size:35px;
    }

    .brandText h1{
        font-size:27px;
    }

    .brandText p{
        font-size:14px;
    }

    .avatar{
        width:43px;
        height:43px;
    }

    .points{
        font-size:15px;
        padding:9px 11px;
    }

    .content{
        padding-left:18px;
        padding-right:18px;
    }

    .balance{
        min-height:470px;
    }

    .balanceTitle{
        font-size:29px;
    }

    .amount{
        font-size:48px;
    }

    .adTitle h2{
        font-size:27px;
    }

    .adIcon{
        width:67px;
        height:67px;
    }

    .mainButton{
        height:72px;
        font-size:25px;
    }

    .navItem{
        font-size:14px;
    }
}

</style>
</head>

<body>

<div class="app">

    <!-- TOP HEADER -->
    <header class="topbar">

        <div class="brand">

            <div class="logo">ϟ</div>

            <div class="brandText">
                <h1>FXO EARN</h1>
                <p>@user</p>
            </div>

        </div>

        <div class="profileTop">

            <div class="avatar">U</div>

            <div class="points">
                ✧ <span id="topPoints">0</span> Pts
            </div>

        </div>

    </header>


    <!-- CONTENT -->
    <main class="content">

        <!-- BALANCE CARD -->
        <section class="glass balance">

            <div class="walletIcon">▱</div>

            <div class="balanceTitle">
                বর্তমান মোট জমা টাকা
            </div>

            <div class="minimum">
                ন্যূনতম উইথড্র ৳১০০০
            </div>

            <div class="amount">
                ৳ <span id="balance">0.00</span> BDT
            </div>

            <div class="rate">
                • ১০০ পয়েন্ট = ৳ ১ টাকা
            </div>

        </section>


        <!-- SINGLE AD -->
        <section class="glass adCard">

            <div class="adHeader">

                <div class="adTitle">

                    <div class="adIcon">▶</div>

                    <h2>সিঙ্গেল অ্যাড</h2>

                </div>

                <div class="status">
                    রেডি
                </div>

            </div>

            <div class="adDescription">
                অ্যাড দেখলে +৫০ পয়েন্ট পাবেন
            </div>

            <button class="mainButton" onclick="watchAd()">
                ▶ &nbsp; অ্যাড দেখুন
            </button>

        </section>


        <!-- DOUBLE AD -->
        <section class="glass adCard double">

            <div class="adHeader">

                <div class="adTitle">

                    <div class="adIcon">▱</div>

                    <h2>৩টি অ্যাড মোড</h2>

                </div>

                <div class="status">
                    ধাপ: 0/3
                </div>

            </div>

            <div class="adDescription">
                ৩টি অ্যাড সম্পূর্ণ করলে +২০০ পয়েন্ট
            </div>

            <button class="mainButton" onclick="startDoubleAd()">
                ⚡ &nbsp; ট্রিপল অ্যাড শুরু করুন
            </button>

        </section>

    </main>


    <!-- BOTTOM NAV -->
    <nav class="bottomNav">

        <div class="navItem active" onclick="setActive(this)">
            <div class="navIcon">▷</div>
            <div>অ্যাড আয়</div>
        </div>

        <div class="navItem" onclick="setActive(this)">
            <div class="navIcon">▣</div>
            <div>ভিডিও</div>
        </div>

        <div class="navItem" onclick="setActive(this)">
            <div class="navIcon">♙</div>
            <div>প্রোফাইল</div>
        </div>

        <div class="navItem" onclick="setActive(this)">
            <div class="navIcon">▱</div>
            <div>ওয়ালেট</div>
        </div>

    </nav>

</div>


<script>

/* =========================
   POINT SYSTEM
========================= */

let points = 0;

function updateBalance(){

    document.getElementById("topPoints").innerText = points;

    let taka = points / 100;

    document.getElementById("balance").innerText =
        taka.toFixed(2);

}


/* =========================
   SINGLE AD
========================= */

function watchAd(){

    /*
       এখানে পরে তোমার AdGram /
       বিজ্ঞাপনের JavaScript বসবে।
    */

    alert("Ad system connected হলে এখানে বিজ্ঞাপন চালু হবে।");

}


/* =========================
   TRIPLE AD
========================= */

let doubleStep = 0;

function startDoubleAd(){

    doubleStep++;

    if(doubleStep >= 3){

        points += 200;

        doubleStep = 0;

        updateBalance();

        alert("অভিনন্দন! +200 Points যোগ হয়েছে।");

    }else{

        alert(
            "অ্যাড " +
            doubleStep +
            "/3 সম্পূর্ণ হয়েছে।"
        );

    }

}


/* =========================
   NAVIGATION
========================= */

function setActive(element){

    document
        .querySelectorAll(".navItem")
        .forEach(item => {

            item.classList.remove("active");

        });

    element.classList.add("active");

}


/* INITIAL */
updateBalance();

</script>

</body>
</html>
